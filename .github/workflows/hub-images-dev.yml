# Hub tip images (:dev). Push + Render on every push to `dev` (and manual Run).
name: hub-images-dev

on:
  workflow_dispatch:
  push:
    branches:
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push-dev:
    name: Build and push Hub :dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker images for tip
        run: |
          APP_VERSION=$(jq -r .version examples/frontend/angular/package.json)
          docker compose -f docker/docker-compose.cicd.yml build \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg GIT_SHA="${{ github.sha }}"

          docker build -f mcp/Dockerfile -t casper-rust-wasm-sdk-mcp:latest .

          for image in casper-webclient cors-anywhere ws-proxy casper-rust-wasm-sdk-mcp; do
            docker tag "${image}:latest" "${{ secrets.DOCKER_USERNAME_ITC }}/${image}:dev"
          done

      - name: Push Docker images to Docker Hub
        run: |
          for image in casper-webclient cors-anywhere ws-proxy casper-rust-wasm-sdk-mcp; do
            docker push "${{ secrets.DOCKER_USERNAME_ITC }}/${image}:dev"
          done

      - name: Log in to GHCR (personal)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Tag and push personal GHCR :dev
        run: |
          for image in casper-webclient cors-anywhere ws-proxy casper-rust-wasm-sdk-mcp; do
            docker tag "${image}:latest" "ghcr.io/groussac/${image}:dev"
            docker push "ghcr.io/groussac/${image}:dev"
          done

      - name: Log in to GHCR (Interchouette / ITC)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME_ITC }}
          password: ${{ secrets.GHCR_PAT_ITC }}

      - name: Tag and push worker and org GHCR :dev
        run: |
          for image in casper-webclient cors-anywhere ws-proxy casper-rust-wasm-sdk-mcp; do
            docker tag "${image}:latest" "ghcr.io/interchouette/${image}:dev"
            docker tag "${image}:latest" "ghcr.io/interchouette-itc/${image}:dev"
            docker push "ghcr.io/interchouette/${image}:dev"
            docker push "ghcr.io/interchouette-itc/${image}:dev"
          done

      - name: Trigger Render redeploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set; skipping Render redeploy"
            exit 0
          fi
          echo "Triggering Render deploy hook (image tag :dev)…"
          curl -fsS -X GET "${RENDER_DEPLOY_HOOK}"
          echo
          echo "Render deploy requested"
