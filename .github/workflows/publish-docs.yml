name: Publish docs

on:
  release:
    # Semver cuts created outside Actions (PAT / UI). Tip Pre-release assets are
    # built in Dev preview release (GITHUB_TOKEN cannot chain release→workflow).
    types: [created]

permissions:
  contents: write

jobs:
  build-and-deploy:
    # Stable docs only — do not overwrite GitHub Pages from overnight Pre-releases.
    if: ${{ !github.event.release.prerelease }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [24.x]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build packages and apps
        run: make build

      - name: Doc
        run: make doc

      - name: Github pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs # The folder the action should deploy.

  desktop-assets:
    # Electron + MCP on product releases (not tags that only ship MCP crates).
    if: ${{ !contains(github.event.release.tag_name, 'mcp') }}
    uses: ./.github/workflows/upload-release-assets.yml
    with:
      tag: ${{ github.event.release.tag_name }}
      ref: ${{ github.event.release.tag_name }}
    secrets: inherit
