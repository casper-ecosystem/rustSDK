name: Publish docs

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-deploy:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [22.x]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: rustfmt, clippy
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build packages and apps
        run: make build

      - name: Doc
        run: make doc

      - name: Github pages 🚀
        uses: JamesIves/github-pages-deploy-action@ba1486788b0490a235422264426c45848eac35c6 #v4.4.1
        with:
          folder: docs # The folder the action should deploy.

  desktop-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev fuse libfuse2
          sudo snap install snapcraft --classic

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          target: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build Wasm packages
        run: make pack

      - name: Build Angular frontend
        run: |
          cd examples/frontend/angular
          npm install
          npm run build

      - name: Build Electron desktop assets
        working-directory: examples/desktop/electron
        env:
          SNAPCRAFT_BUILD_ENVIRONMENT: host
        run: |
          npm install
          npx electron-builder --win portable --linux AppImage snap --publish never

      - name: Upload desktop assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_DIR="examples/desktop/electron/release"
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"

          EXE="$RELEASE_DIR/Casper Webclient ${VERSION}.exe"
          APPIMAGE="$RELEASE_DIR/Casper Webclient-${VERSION}.AppImage"
          SNAP="$RELEASE_DIR/casper-webclient_${VERSION}_amd64.snap"

          for f in "$EXE" "$APPIMAGE" "$SNAP"; do
            if [[ ! -f "$f" ]]; then
              echo "Missing asset: $f"
              ls -la "$RELEASE_DIR" || true
              exit 1
            fi
          done

          gh release upload "$TAG" "$EXE" "$APPIMAGE" "$SNAP" --clobber
