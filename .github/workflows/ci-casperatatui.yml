# Path-filtered Casperatatui gate. Opt-in package (not default-members / Hub).
# Checkout layout: sibling ceps-rust-ts-client next to rustSDK so optional path-dep
# in Cargo.toml resolves (Cargo requires the path even when feature `ceps` is off).
name: ci-casperatatui

on:
  push:
    branches: [dev, "feat*", "release-*"]
    paths:
      - "examples/desktop/casperatatui/**"
      - ".github/workflows/ci-casperatatui.yml"
  pull_request:
    branches: [dev, "feat*", "release-*"]
    paths:
      - "examples/desktop/casperatatui/**"
      - ".github/workflows/ci-casperatatui.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: rustSDK

jobs:
  casperatatui:
    name: Lint test smoke Casperatatui
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - uses: actions/checkout@v5
        with:
          path: rustSDK

      - name: Checkout sibling ceps-rust-ts-client
        uses: actions/checkout@v5
        with:
          repository: Interchouette-ITC/ceps-rust-ts-client
          path: ceps-rust-ts-client

      - name: Swatinem cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustSDK

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Lint Casperatatui
        run: make check-lint-casperatatui

      - name: Unit tests
        run: cargo test -p casperatatui --lib

      - name: Release binary
        run: make build-casperatatui-release

      - name: Start Casper NCTL Service
        run: |
          # Hub :dev — compose pins BRANCH_NODE=v2.2.2 (same as :2.2) until
          # casper-node branch dev advances past package 2.2.0; matches SDK types pin.
          mkdir -p assets/users assets/faucet
          docker run -d \
            --name casper-nctl \
            -p 11101-11105:11101-11105 \
            -p 14101-14105:14101-14105 \
            -p 18101-18105:18101-18105 \
            -p 25101-25105:25101-25105 \
            -p 28101-28105:28101-28105 \
            -v $PWD/assets/users:/app/casper-nctl/assets/net-1/users/ \
            -v $PWD/assets/faucet:/app/casper-nctl/assets/net-1/faucet/ \
            interchouette/casper-nctl-2-docker:dev

      - name: Wait for the service to be ready
        run: |
          echo "Waiting for the service to be ready on port 11101..."
          for i in {1..30}; do
            if nc -z localhost 11101; then
              echo "Service is up!"
              echo "Wait 45s for nctl to boot and create keys"
              sleep 45
              break
            fi
            echo "Waiting..."
            sleep 1
          done

          if ! nc -z localhost 11101; then
            echo "Service did not start in time!"
            exit 1
          fi

          echo "Waiting for the service to be ready on http://127.0.0.1:18101/events..."
          for i in {1..30}; do
            if curl --silent --max-time 2 http://127.0.0.1:18101/events | grep -q "ApiVersion"; then
              echo "Service is up!"
              break
            fi
            echo "Waiting..."
            sleep 1
          done

          if ! curl --silent --max-time 2 http://127.0.0.1:18101/events | grep -q "ApiVersion"; then
            echo "Service did not start in time!"
            exit 1
          fi

      - name: Smoke keys from NCTL assets
        run: |
          test -f ./assets/faucet/public_key_hex
          echo "CASPER_SMOKE_ACCOUNT=$(tr -d '[:space:]' < ./assets/faucet/public_key_hex)" >> "$GITHUB_ENV"
          if [ -f ./assets/users/user-1/public_key_hex ]; then
            echo "CASPER_SMOKE_TARGET=$(tr -d '[:space:]' < ./assets/users/user-1/public_key_hex)" >> "$GITHUB_ENV"
          fi

      - name: Smoke status
        run: cargo run -p casperatatui --example smoke_status
        env:
          CASPER_RPC_URL: http://127.0.0.1:11101/rpc

      - name: Smoke write + wait + SSE
        run: |
          CASPER_SECRET_KEY=./assets/users/user-1/secret_key.pem \
            cargo run -p casperatatui --example smoke_write_wait
        env:
          CASPER_RPC_URL: http://127.0.0.1:11101/rpc
