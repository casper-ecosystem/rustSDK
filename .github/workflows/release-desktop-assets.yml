name: release-desktop-assets

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build Wasm packages
        run: make pack

      - name: Build Angular frontend
        run: |
          cd examples/frontend/angular
          npm install
          npm run build

      - name: Build Electron desktop assets
        working-directory: examples/desktop/electron
        run: |
          npm install
          npx electron-builder --win portable --linux AppImage

      - name: Upload desktop assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_DIR="examples/desktop/electron/release"
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"

          EXE="$RELEASE_DIR/Casper Webclient ${VERSION}.exe"
          APPIMAGE="$RELEASE_DIR/Casper Webclient-${VERSION}.AppImage"

          if [[ ! -f "$EXE" ]]; then
            echo "Missing Windows portable: $EXE"
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi
          if [[ ! -f "$APPIMAGE" ]]; then
            echo "Missing Linux AppImage: $APPIMAGE"
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi

          gh release upload "$TAG" "$EXE" "$APPIMAGE" --clobber
