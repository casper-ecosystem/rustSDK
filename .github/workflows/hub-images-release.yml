# Hub stable images after a real GitHub Release (not bare tag push).
# Also moves :dev to the release digest (intentional) and redeploys Render.
name: hub-images-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Hub tag without leading v (e.g. 2.2.2). Empty uses Angular package.json version.
        required: false
        type: string
      ref:
        description: Git ref to build (tag, branch, or SHA). Empty uses the workflow ref.
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push-release:
    name: Build and push Hub semver + latest + :dev
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}

      - name: Resolve release version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(jq -r .version examples/frontend/angular/package.json)
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not resolve release version" >&2
            exit 1
          fi
          PKG=$(jq -r .version examples/frontend/angular/package.json)
          if [ "$VERSION" != "$PKG" ]; then
            echo "Refusing Hub tag $VERSION: Angular package.json is $PKG" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved Hub release tag: $VERSION"

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker images for release
        run: |
          APP_VERSION="${{ steps.ver.outputs.version }}"
          GIT_SHA=$(git rev-parse HEAD)
          docker compose -f docker/docker-compose.cicd.yml build \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg GIT_SHA="$GIT_SHA"

          docker build -f mcp/Dockerfile -t casper-rust-wasm-sdk-mcp:latest .

          for image in casper-webclient cors-anywhere ws-proxy casper-rust-wasm-sdk-mcp; do
            docker tag "${image}:latest" "interchouette/${image}:${APP_VERSION}"
            docker tag "${image}:latest" "interchouette/${image}:latest"
            docker tag "${image}:latest" "interchouette/${image}:dev"
          done

      - name: Push Docker images to Docker Hub
        run: |
          APP_VERSION="${{ steps.ver.outputs.version }}"
          for image in casper-webclient cors-anywhere ws-proxy casper-rust-wasm-sdk-mcp; do
            docker push "interchouette/${image}:${APP_VERSION}"
            docker push "interchouette/${image}:latest"
            docker push "interchouette/${image}:dev"
          done

      - name: Log in to GHCR (personal)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Tag and push personal GHCR
        run: |
          APP_VERSION="${{ steps.ver.outputs.version }}"
          for image in casper-webclient cors-anywhere ws-proxy casper-rust-wasm-sdk-mcp; do
            docker tag "${image}:latest" "ghcr.io/groussac/${image}:${APP_VERSION}"
            docker tag "${image}:latest" "ghcr.io/groussac/${image}:latest"
            docker tag "${image}:latest" "ghcr.io/groussac/${image}:dev"
            docker push "ghcr.io/groussac/${image}:${APP_VERSION}"
            docker push "ghcr.io/groussac/${image}:latest"
            docker push "ghcr.io/groussac/${image}:dev"
          done

      - name: Log in to GHCR (Interchouette / ITC)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME_ITC }}
          password: ${{ secrets.GHCR_PAT_ITC }}

      - name: Tag and push worker and org GHCR
        run: |
          APP_VERSION="${{ steps.ver.outputs.version }}"
          for image in casper-webclient cors-anywhere ws-proxy casper-rust-wasm-sdk-mcp; do
            for ns in interchouette interchouette-itc; do
              docker tag "${image}:latest" "ghcr.io/${ns}/${image}:${APP_VERSION}"
              docker tag "${image}:latest" "ghcr.io/${ns}/${image}:latest"
              docker tag "${image}:latest" "ghcr.io/${ns}/${image}:dev"
              docker push "ghcr.io/${ns}/${image}:${APP_VERSION}"
              docker push "ghcr.io/${ns}/${image}:latest"
              docker push "ghcr.io/${ns}/${image}:dev"
            done
          done

      - name: Trigger Render redeploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set; skipping Render redeploy"
            exit 0
          fi
          echo "Triggering Render deploy hook (image tag :dev)…"
          curl -fsS -X GET "${RENDER_DEPLOY_HOOK}"
          echo
          echo "Render deploy requested"
