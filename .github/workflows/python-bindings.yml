# Offline unit tests for python/** (maturin + cargo test + pytest).
name: python-bindings

on:
  push:
    branches: [dev, "feat*", "release-*"]
    paths:
      - "python/**"
      - ".github/workflows/python-bindings.yml"
      - "Makefile"
  pull_request:
    branches: [dev, "feat*", "release-*"]
    paths:
      - "python/**"
      - ".github/workflows/python-bindings.yml"
      - "Makefile"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
        working-directory: ${{ github.workspace }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Swatinem cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: venv + maturin develop
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "maturin>=1.7,<2.0" "pytest>=8,<9"
          maturin develop

      - name: Rust unit (params parsers)
        run: |
          . .venv/bin/activate
          cargo test --manifest-path Cargo.toml --lib

      - name: Pytest offline unit
        run: |
          . .venv/bin/activate
          pytest tests/test_unit_offline.py -q
