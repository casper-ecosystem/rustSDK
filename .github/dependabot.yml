version: 2
# Weekly version updates (ignore major). Security alerts are separate (repo graph).
# npm: every package.json + lock under examples/ and tests/e2e.
# cargo: root workspace Cargo.lock; python/ has its own lock (excluded workspace).
updates:
  - package-ecosystem: npm
    directory: /examples/frontend/angular
    schedule:
      interval: weekly
      day: monday
    reviewers:
      - gRoussac
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: npm
    directory: /examples/frontend/react
    schedule:
      interval: weekly
      day: monday
    reviewers:
