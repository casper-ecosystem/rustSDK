[package]
name = "casper-rust-wasm-sdk-mcp"
version = "2.2.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "MCP server for casper-rust-wasm-sdk (stdio + Streamable HTTP)"
readme = "README.md"
repository = "https://github.com/casper-ecosystem/casper-rust-wasm-sdk"
authors = ["gRoussac"]

[[bin]]
name = "casper-rust-wasm-sdk-mcp"
path = "src/main.rs"

[lib]
name = "casper_rust_wasm_sdk_mcp"
path = "src/lib.rs"

[features]
default = ["full"]
full = [
  "rpc",
  "binary-port",
  "transaction",
  "deploy",
  "contract",
  "helpers",
  "write",
  "watcher",
]
rpc = []
binary-port = ["casper-rust-wasm-sdk/binary-port"]
transaction = ["casper-rust-wasm-sdk/transaction"]
deploy = ["casper-rust-wasm-sdk/deploy"]
contract = ["casper-rust-wasm-sdk/contract"]
helpers = ["casper-rust-wasm-sdk/helpers"]
write = ["transaction", "deploy", "contract"]
watcher = ["casper-rust-wasm-sdk/watcher"]
SSE = ["watcher", "casper-rust-wasm-sdk/SSE"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
  "json",
] }
casper-rust-wasm-sdk = { path = "..", default-features = false }
casper-types = { version = "7.1.1", default-features = false, features = [
  "datasize",
] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rmcp = { version = "3.1.2", default-features = false, features = [
  "server",
  "macros",
  "transport-io",
  "transport-streamable-http-server",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
