[package]
name = "casperatatui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Casperatatui: Casper TUI over casper-rust-wasm-sdk (ratatui)"
publish = false
readme = "README.md"

[[bin]]
name = "casperatatui"
path = "src/main.rs"

[lib]
name = "casperatatui"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
casper-rust-wasm-sdk = { path = "../../..", default-features = false, features = [
  "transaction",
  "contract",
  "helpers",
  "watcher",
  "SSE",
] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
ctrlc = "3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }

# TestBackend ships with ratatui 0.30 (no extra feature).
