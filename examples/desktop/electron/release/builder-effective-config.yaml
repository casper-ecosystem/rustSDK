directories:
  output: release
  buildResources: build
appId: com.example.myapp
productName: Casper Webclient
compression: store
win:
  target: portable
  icon: favicon.png
linux:
  category: Network
  icon: favicon.png
mac:
  category: Network
  icon: favicon.png
files:
  - filter:
      - index.js
      - favicon.png
extraFiles:
  - from: ./../../frontend/angular/dist/casper
    to: frontend/angular/dist/casper
  - from: ./../../frontend/angular/ws-proxy.js
    to: resources/ws-proxy.js
extraResources:
  - from: node_modules/ws
    to: node_modules/ws
    filter:
      - '**/*'
electronVersion: 39.2.7
