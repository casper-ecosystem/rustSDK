[package]
name = "sdk_tests"
version = "2.2.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
casper-rust-wasm-sdk = { path = "../../../", version = "2.2.2", features = [
    "SSE",
] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
serde_json = "*"
dotenvy = "0.15.7"

[[bin]]
name = "sdk_tests"
path = "src/main.rs"

[lib]
name = "sdk_tests"
path = "src/lib.rs"
