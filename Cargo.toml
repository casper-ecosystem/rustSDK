[package]
name = "casper-rust-wasm-sdk"
version = "2.0.0"
edition = "2021"
description = "Casper Rust Wasm Web SDK"
repository = "https://github.com/casper-ecosystem/casper-rust-wasm-sdk"
license = "Apache-2.0"
readme = "docs/README.md"
homepage = "https://www.casper.network"
categories = ["development-tools", "wasm", "web-programming"]
keywords = ["casper", "sdk", "rust", "wasm"]
exclude = [
  ".*",
  "docs/api-wasm",
  "docs/images",
  "examples",
  "pkg",
  "pkg-nodejs",
  "tests/**",
]

[dependencies]
casper-types = { version = "6.1.0", default-features = false, features = [
  "datasize",
] }
casper-client = { version = "5", default-features = false }
casper-binary-port = { version = "1.1.1" }
casper-binary-port-access = { version = "0.1.0" }
rand = { version = "0.9.2", default-features = false, features = [
  "thread_rng",
] }
getrandom = { version = "0.3.3", default-features = false, features = [
  "wasm_js",
] }
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "*"
js-sys = "*"
gloo-utils = { version = "0.2", default-features = false, features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
once_cell = { version = "1", default-features = false }
chrono = "0.4"
num-traits = "0.2"
humantime = "2"
thiserror = "2"
base16 = "0.2"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false }
bigdecimal = "0.4"
blake2 = { version = "0.10", default-features = false }
reqwest = { version = "0.12.12", default-features = false, features = [
  "stream",
] }
futures-util = "*"
async-trait = "0.1"

[lib]
crate-type = ["cdylib", "rlib"]
name = "casper_rust_wasm_sdk"
path = "src/lib.rs"

[[bin]]
name = "casper_rust_wasm_sdk"
path = "src/main.rs"
doc = false

[profile.release]
lto = true

[dev-dependencies]
sdk_tests = { path = "tests/integration/rust" }
tokio = { version = "1", features = ["full"] }
ctor = "*"
dotenvy = "0.15.7"

[patch.crates-io]
casper-client = { version = "5", git = "https://github.com/casper-ecosystem/casper-client-rs", branch = "dev" }
casper-types = { git = "https://github.com/casper-network/casper-node", branch = "dev" }
casper-binary-port = { git = "https://github.com/casper-network/casper-node", branch = "dev" }
casper-binary-port-access = { git = "https://github.com/gRoussac/casper-binary-port-client", branch = "casper_1.1.1" }
