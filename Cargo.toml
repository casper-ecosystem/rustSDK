[workspace]
members = [".", "mcp"]
exclude = ["python"]
# Keep the root package as the only default member so `cargo clippy --lib` /
# CI do not build mcp. python/ is a standalone maturin crate (path-dep on root
# + its own [patch.crates-io]); excluded so MCP Docker contexts need not COPY it.
default-members = ["."]
resolver = "2"

[package]
name = "casper-rust-wasm-sdk"
version = "2.2.2"
edition = "2021"
description = "Casper Rust Wasm Web SDK"
repository = "https://github.com/casper-ecosystem/casper-rust-wasm-sdk"
license = "Apache-2.0"
readme = "docs/README.md"
homepage = "https://www.casper.network"
categories = ["development-tools", "wasm", "web-programming"]
keywords = ["casper", "sdk", "rust", "wasm"]
exclude = [
  ".*",
  "docs/api-wasm",
  "docs/images",
  "examples",
  "mcp",
  "python",
  "pkg",
  "pkg-nodejs",
  "tests/**",
]

[features]
default = ["full"]
# Convenience bundle (not a product gate). Includes `watcher`, not full `SSE`.
full = [
  "transaction",
  "deploy",
  "contract",
  "binary-port",
  "watcher",
  "helpers",
]
transaction = []
deploy = []
contract = []
binary-port = ["dep:casper-binary-port", "dep:casper-binary-port-access"]
# Wait/watch helpers only.
watcher = []
# Node SSE client + CES parser; includes wait/watch.
SSE = ["watcher"]
helpers = []

[dependencies]
casper-types = { version = "7.1.1", default-features = false, features = [
  "datasize",
] }
casper-client = { version = "5", default-features = false }
casper-binary-port = { version = "1.2.1", optional = true }
casper-binary-port-access = { version = "0.1.0", optional = true }
rand = { version = "0.9.2", default-features = false, features = [
  "thread_rng",
] }
getrandom = { version = "0.3.3", default-features = false, features = [
  "wasm_js",
] }
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "*"
js-sys = "*"
gloo-utils = { version = "0.2", default-features = false, features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
once_cell = { version = "1", default-features = false }
chrono = "0.4"
num-traits = "0.2"
humantime = "2"
thiserror = "2"
base16 = "0.2"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false }
bigdecimal = "0.4"
blake2 = { version = "0.10", default-features = false }
reqwest = { version = "0.12.12", default-features = false, features = [
  "stream",
] }
futures-util = "*"
async-trait = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["time"] }

[lib]
crate-type = ["cdylib", "rlib"]
name = "casper_rust_wasm_sdk"
path = "src/lib.rs"

[[bin]]
name = "casper_rust_wasm_sdk"
path = "src/main.rs"
doc = false

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

# SSE (and current rustc) emit bulk-memory / saturating trunc ops; Binaryen 130
# needs features enabled or wasm-opt rejects the module.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "-all"]

[dev-dependencies]
sdk_tests = { path = "tests/integration/rust" }
tokio = { version = "1", features = ["full"] }
ctor = "*"
dotenvy = "0.15.7"

[patch.crates-io]
casper-client = { version = "5", git = "https://github.com/casper-ecosystem/casper-client-rs", branch = "dev" }
# NOT a normal `dev` pin: casper-node's own `dev` branch still declares version
# "2.2.0" (https://github.com/casper-network/casper-node/blob/dev/node/Cargo.toml#L3),
# so we track release tag v2.2.2 until that line (and crates) move forward. Then
# switch these back to `branch = "dev"` (and casper_2.2.2 → matching access branch).
casper-types = { git = "https://github.com/casper-network/casper-node", tag = "v2.2.2" }
casper-binary-port = { git = "https://github.com/casper-network/casper-node", tag = "v2.2.2" }
casper-binary-port-access = { git = "https://github.com/gRoussac/casper-binary-port-client", branch = "casper_2.2.2" }
