services:
  casper-webclient:
    container_name: casper-webclient
    image: casper-webclient:latest
    build:
      dockerfile: ./docker/Dockerfile.cicd
      context: ../
    ports:
      - "8080:8080"
    environment:
      # Set BASE_HREF for subpath deployments (e.g., /webclient/)
      # Defaults to / if not set
      - BASE_HREF=${BASE_HREF:-/}
      # Runtime configuration for CORS and network URLs
      # CORS_ANYWHERE_URL: Optional, overrides docker_gateway/cors_anywhere_port construction
      # Example: http://cors-anywhere.casper-box:11100
      - CORS_ANYWHERE_URL=${CORS_ANYWHERE_URL:-}
      # NETWORK_RPC_URL: Optional, overrides selected network's rpc_address
      # Example: http://casper-nctl.casper-box:11101/rpc
      - NETWORK_RPC_URL=${NETWORK_RPC_URL:-}
      # NETWORK_NODE_URL: Optional, overrides selected network's node_address
      # Example: ws://casper-nctl.casper-box:4300/?targetPort=28101&targetHost=...
      - NETWORK_NODE_URL=${NETWORK_NODE_URL:-}
    networks:
      - casper-network

  # Build and run image with Dockerfile
  # docker build -t casper-webclient . --force-rm
  # docker container run -t -i --rm -h casper-webclient -p 8080:8080 casper-webclient

  cors-anywhere:
    image: cors-anywhere:latest
    container_name: cors-anywhere
    build:
      context: ../
      dockerfile: ./docker/cors-anywhere.Dockerfile
    tty: true
    environment:
      PORT: 11100

      # Set allowed origins here with casper-webclient url
      ORIGIN_WHITELIST: |
        http://localhost:8080,
        http://localhost:4200,
        http://127.0.0.1:8080,
        http://127.0.0.1:4200

    ports:
      - 11100:11100
    networks:
      - casper-network

  ws-proxy:
    image: ws-proxy:latest
    container_name: ws-proxy
    build:
      context: ../
      dockerfile: ./docker/ws-proxy.Dockerfile
    tty: true
    environment:
      PORT: 4300

      # Set allowed origins here with casper-webclient url
      ALLOWED_HOSTS: |
        localhost,
        127.0.0.1,
        172.18.0.1

      # Set allowed origins here with casper-webclient url
      ALLOWED_PORTS: |
        28101,
        7779

    ports:
      - 4300:4300
    networks:
      - casper-network

networks:
  casper-network:
    external: false
